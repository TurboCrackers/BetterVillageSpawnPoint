plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.10.1' apply false
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}


// Deploy-to-Prism tasks. Shared verbatim across every release branch.
// Do not edit inline here -- change gradle/deploy.gradle and copy it forward.
apply from: rootProject.file('gradle/deploy.gradle')
