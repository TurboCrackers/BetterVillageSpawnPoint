plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id("net.neoforged.moddev") version "2.0.106" apply false
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}



// -------------- TESTING SUITE -------------- //
ext {
    def userHome  = System.getProperty('user.home')
    def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')

    // Override per machine with -PprismRoot=/path -PprismExe=/path, or the
    // PRISM_ROOT / PRISM_CLI environment variables. Hardcoding a single OS's paths
    // here breaks configuration on the others (Gradle can't turn "C:/..." into a file).
    prismRoot = "/Users/tubbycakes/Documents/PrismLauncher"

    // Path to Prism/MultiMC CLI executable
    prismExe = (findProperty('prismExe') ?: System.getenv('PRISM_CLI') ?: (isWindows
            ? "${userHome}/AppData/Local/Programs/PrismLauncher/prismlauncher.exe"
            : "/Applications/Prism Launcher.app/Contents/MacOS/prismlauncher")).toString()

    // Instance names as shown in Prism's UI
    instNameFabric = "${minecraft_version}-Fabric"
    instNameForge  = "${minecraft_version}-Forge"
    instNameNeo    = "${minecraft_version}-NeoForge"

    // Where those instances live (open instance folder in Prism to confirm)
    instFabricMods = "${prismRoot}/instances/${instNameFabric}/minecraft/mods"
    instForgeMods  = "${prismRoot}/instances/${instNameForge}/minecraft/mods"
    instNeoMods    = "${prismRoot}/instances/${instNameNeo}/minecraft/mods"
}

// ---------- FABRIC ----------
tasks.register("buildFabricRelease") {
    dependsOn(":fabric:remapJar") // Loom's obfuscated, distributable jar
}

tasks.register("deployFabricToInstance", Copy) {
    dependsOn("buildFabricRelease")
    from(project(":fabric").tasks.named("remapJar"))
    into(file(instFabricMods))
    rename { _ -> "${mod_id}-fabric-${minecraft_version}-${version}.jar" }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        delete fileTree(instFabricMods) { include "${mod_id}-fabric-${minecraft_version}-${version}.jar" }
    }
}

tasks.register("runFabricObf", Exec) {
    dependsOn("deployFabricToInstance")
    commandLine prismExe, "--launch", instNameFabric
}

// ---------- FORGE ----------
tasks.register("buildForgeRelease") {
    // In FG 6+, reobf runs on build; the output in forge/build/libs is obfuscated
    dependsOn(":forge:build")
}

tasks.register("deployForgeToInstance", Copy) {
    dependsOn("buildForgeRelease")
    from(fileTree(rootProject.file("forge/build/libs")) {
        include("*.jar")
        // If you have multiple jars (sources, dev), pick your classifier:
        exclude("*-sources.jar", "*-dev.jar")
    })
    into(file(instForgeMods))
    rename { _ -> "${mod_id}-forge-${minecraft_version}-${version}.jar" }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        delete fileTree(instForgeMods) { include "${mod_id}-forge-${minecraft_version}-${version}.jar" }
    }
}

tasks.register("runForgeObf", Exec) {
    dependsOn("deployForgeToInstance")
    commandLine prismExe, "--launch", instNameForge
}

// ---------- NEOFORGE ----------
tasks.register("buildNeoRelease") {
    dependsOn(":neoforge:build") // same idea: the lib jar is your reobf jar
}

tasks.register("deployNeoToInstance", Copy) {
    dependsOn("buildNeoRelease")
    from(fileTree(rootProject.file("neoforge/build/libs")) {
        include("*.jar")
        exclude("*-sources.jar", "*-dev.jar")
    })
    into(file(instNeoMods))
    rename { _ -> "${mod_id}-neoforge-${minecraft_version}-${version}.jar" }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        delete fileTree(instNeoMods) { include "${mod_id}-neoforge-${minecraft_version}-${version}.jar" }
    }
}

tasks.register("runNeoObf", Exec) {
    dependsOn("deployNeoToInstance")
    commandLine prismExe, "--launch", instNameNeo
}

// ---------- Convenience ----------
tasks.register("runAllObf") {
    dependsOn("runFabricObf", "runForgeObf", "runNeoObf")
}