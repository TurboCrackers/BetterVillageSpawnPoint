# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=com.turbocrackers.bettervillagespawnpoint

# Common
minecraft_version=1.19.1
mod_name=BetterVillageSpawnPoint
mod_author=TurboCrackers
mod_id=bettervillagespawnpoint
license=CC0-1.0
credits=
description=A mod that automatically sets the spawn point to a reasonable spot in the nearest village from a configurable list of village IDs\n\n(example: minecraft:village_plains) and/or tags (example: #minecraft:villages).\n\nIt tries really hard to put you on the ground if it can, as opposed to other mods that will spawn you in a tree or on an island above a village.
minecraft_version_range=[1.19.1, 1.20)

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.18.2
parchment_version=2022.11.06

# Fabric

# https://fabricmc.net/develop/
fabric_version=0.58.5+1.19.1
fabric_loader_version=0.17.2
cloth_config_api_version=8.3.134
loom_version=1.10.1

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=42.0.9
forge_loader_version_range=[42,)

# Gradle
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false

# Java
java_version=17
java_version_name=JAVA_17