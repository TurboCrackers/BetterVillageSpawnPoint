# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.3
group=com.turbocrackers.bettervillagespawnpoint
java_version=17

# Common
minecraft_version=1.20.1
mod_name=BetterVillageSpawnPoint
mod_author=TurboCrackers
mod_id=bettervillagespawnpoint
license=CC0-1.0
credits=
description=A mod that chooses a safe village spawn point that's actually IN the village- not above or below it.
# Each branch ships a jar built and tested against exactly one Minecraft release. The API moves
# between patch releases (1.21.9 spawn rework, 1.21.11 Identifier rename, 26.2 tag changes), so a
# wider range only turns a clean loader refusal into a crash at startup.
minecraft_version_range=[1.20.1]
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false