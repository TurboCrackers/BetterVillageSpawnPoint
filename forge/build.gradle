plugins {
    id 'multiloader-common'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

minecraft {
    // 1.12.2 predates the official Mojang mappings; MCP 'stable' names are the only option.
    mappings channel: mcp_mappings_channel, version: mcp_mappings_version

    copyIdeResources = true //Calls processResources when in dev

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

jar.finalizedBy('reobfJar')

// @Mod on 1.12.2 takes its version from a compile-time constant (there is no mods.toml to
// expand), so make sure Constants.MOD_VERSION and gradle.properties' version never drift apart.
tasks.register('checkModVersionConstant') {
    group = 'verification'
    description = 'Fails if Constants.MOD_VERSION does not match the version in gradle.properties.'
    def constants = file('src/main/java/com/turbocrackers/bettervillagespawnpoint/Constants.java')
    inputs.file(constants)
    inputs.property('version', version)
    doLast {
        def m = (constants.text =~ /MOD_VERSION\s*=\s*"([^"]+)"/)
        if (!m.find()) throw new GradleException("checkModVersionConstant: no MOD_VERSION constant in ${constants}")
        if (m.group(1) != version.toString()) throw new GradleException("checkModVersionConstant: Constants.MOD_VERSION is ${m.group(1)} but gradle.properties says ${version}")
    }
}
tasks.named('check') { dependsOn 'checkModVersionConstant' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
