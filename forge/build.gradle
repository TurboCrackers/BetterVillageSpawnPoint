plugins {
    id 'multiloader-loader'
    // ForgeGradle 7 (Forge 61+ / Minecraft 1.21.11+). FG7 dropped the MixinGradle plugin:
    // mixins are compiled by the Mixin annotation processor and registered through the jar
    // manifest and the --mixin.config run argument instead.
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
    id 'idea'
}
base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

minecraft {
    // Forge 1.20.6+ runs on official mappings, so nothing is reobfuscated and no refmap is needed.
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            args "--mixin.config=${mod_id}.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json"

            // LWJGL must open the window on the process's first thread on macOS. Loom and
            // ModDevGradle add this flag to their client runs themselves; ForgeGradle 7 does not.
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // The Mixin annotation processor is deliberately not applied. Its only job is to write a
    // refmap, which Forge has not needed since it moved to official mappings at runtime in
    // 1.20.6, and without an obfuscation mapping to resolve against it rejects every @Inject
    // target. NeoForge builds already run these same mixins with no refmap.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
